<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Médias</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Sora:wght@100..800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
                <link rel="stylesheet" href="./main.css"> 
        <header>
            <img src="./logo.png" alt="capelo e diploma">
            <h1>Calculadora de Médias</h1>
        </header>
        <form id="form-atividade">
            <input type="text" id="nome-atividade" required placeholder="Nome da atividade"/>
            <input type="number" id="nota-atividade" required placeholder="Nota da atividade" min="0" max="10"/>
            <button type="submit">Adicionar +</button>

        </form>
        <table cellspacing="0">  <!-- cellspacing é para tirar o espaçamento entre as bordas das células da tabela -->
            <thead> 
                <tr> 
                    <th> 
                        Nome da Atividade
                    </th> 
                    <th>
                        Nota da Atividade
                    </th>
                    <th>
                        Aprovado?
                    </th>
                </tr>        
            </thead>
                <tbody>
                </tbody>

            <tfoot>
                <tr>
                    <td>
                        Média Final
                    </td>
                    <td id="media-final-valor">
                        ---
                    </td>
                    <td id="media-final-resultado"> 
                        <span class="resultado aprovado">---</span> <!-- span para estilizar o resultado -->
                    </td>
                </tr>

            </tfoot>

        </table>

    </div>
    <script src="./main.js"></script>
</body>

</html>
